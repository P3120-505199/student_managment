services:
  postgres:
    image: postgres:16-alpine
    container_name: web-lab-3-postgres

    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: